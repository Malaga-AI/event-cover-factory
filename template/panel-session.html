<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;0,700;0,800;0,900;1,600;1,700;1,800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 2160px;
    height: 1080px;
    overflow: hidden;
    position: relative;
    background: #ffffff;
    font-family: 'Barlow', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
  }

  /* ─── LAYER 1 – Background photo (top) ─── */
  .bg-photo {
    position: absolute;
    top: 0;
    left: 0;
    width: 2160px;
    height: 590px;
    object-fit: cover;
    object-position: center 30%;
    filter: grayscale(100%) brightness(0.55);
    z-index: 1;
  }

  /* ─── LAYER 2 – Cyan title banner (full-width) ─── */
  .title-banner {
    position: absolute;
    top: 230px;
    left: 0;
    width: 2160px;
    height: 210px;
    background: #18DAE3;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 100px;
    z-index: 3;
  }
  .title-banner h1 {
    color: #090E2A;
    font-size: 96px;
    font-weight: 900;
    letter-spacing: -1.8px;
    line-height: 1.02;
    text-align: center;
  }

  /* ─── LAYER 3 – Date banner (narrower, centred) ─── */
  .date-banner {
    position: absolute;
    top: 440px;
    left: 50%;
    transform: translateX(-50%);
    width: 1760px;
    height: 150px;
    background: #090E2A;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }
  .date-banner p {
    color: #18DAE3;
    font-size: 68px;
    font-weight: 700;
    font-style: italic;
    letter-spacing: 1px;
  }

  /* ─── LAYER 4 – Malaga-AI horizontal logo (top-right) ─── */
  .malaga-logo {
    position: absolute;
    top: 50px;
    right: 56px;
    height: 130px;
    width: auto;
    z-index: 4;
  }

  /* ─── LAYER 5 – White panelists band ─── */
  .speakers {
    position: absolute;
    top: 590px;
    left: 0;
    width: 2160px;
    height: 490px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  .speakers-row {
    display: flex;
    align-items: center;
    width: 2160px;
  }

  .speaker-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 24px;
    padding: 0 60px;
  }

  .speaker-photo {
    width: 270px;
    height: 270px;
    border-radius: 50%;
    border: 6px solid #18DAE3;
    background: #f5f5f5;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .speaker-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .speaker-info {
    max-width: 600px;
  }
  .speaker-name {
    font-size: 48px;
    color: #090E2A;
    font-weight: 700;
    line-height: 1.05;
    margin-bottom: 8px;
  }
  .speaker-role {
    font-size: 32px;
    color: #888;
    font-weight: 400;
    line-height: 1.15;
  }

  .divider {
    width: 1px;
    height: 320px;
    background: #d8d8d8;
    flex-shrink: 0;
  }

  /* ─── 3-panelist tightening (added by generator when panelists.length === 3) ─── */
  .speakers-row.panelists-3 {
    /* Shift the row up so the centred sponsor logo (bottom: 20px, h: 90px)
       doesn't overlap the middle panelist's name/role. */
    margin-bottom: 100px;
  }
  .speakers-row.panelists-3 .speaker-card {
    padding: 0 30px;
    gap: 20px;
  }
  .speakers-row.panelists-3 .speaker-photo {
    width: 220px;
    height: 220px;
    border-width: 5px;
  }
  .speakers-row.panelists-3 .speaker-name {
    font-size: 42px;
  }
  .speakers-row.panelists-3 .speaker-role {
    font-size: 28px;
  }
  .speakers-row.panelists-3 .divider {
    height: 280px;
  }

  /* ─── LAYER 6 – Sponsor (bottom-centre) ─── */
  .sponsor {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
  }
  .sponsor-logo {
    height: 90px;
    width: auto;
    filter: invert(1);
    opacity: 0.85;
    display: block;
  }
</style>
</head>
<body>

  <!-- LAYER 1 -->
  <img class="bg-photo" src="{{BACKGROUND_IMAGE}}" alt="" />

  <!-- LAYER 4 (top-right logo, above banners) -->
  <img class="malaga-logo" src="{{MALAGA_LOGO}}" alt="Malaga-AI" />

  <!-- LAYER 2 -->
  <div class="title-banner">
    <h1>{{TITLE}}</h1>
  </div>

  <!-- LAYER 3 -->
  <div class="date-banner">
    <p>{{DATE}} | {{HOUR}}h | {{VENUE}}</p>
  </div>

  <!-- LAYER 5 -->
  <div class="speakers">
    <div class="speakers-row {{ROW_CLASS}}">
      {{SPEAKER_CARDS}}
    </div>
  </div>

  <!-- LAYER 6 -->
  <div class="sponsor">
    <img class="sponsor-logo" src="{{SPONSOR_LOGO}}" alt="Grupo Billingham" />
  </div>

</body>
</html>
