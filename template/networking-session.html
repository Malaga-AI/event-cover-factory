<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600;1,700;1,800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 2160px;
    height: 1080px;
    overflow: hidden;
    position: relative;
    background: #090E2A;
    font-family: 'Barlow', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
  }

  /* ─── Right-hand B/W cityscape photo ─── */
  .side-photo {
    position: absolute;
    top: 0;
    right: 0;
    width: 760px;
    height: 1080px;
    object-fit: cover;
    object-position: center center;
    filter: grayscale(100%) brightness(0.95) contrast(1.05);
    z-index: 1;
  }

  /* ─── Cyan month tile (top-left) ─── */
  .month-tile {
    position: absolute;
    top: 80px;
    left: 90px;
    width: 230px;
    height: 230px;
    background: #18DAE3;
    color: #090E2A;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
    font-weight: 800;
    z-index: 3;
  }
  .month-tile .month-top {
    font-size: 80px;
    letter-spacing: 1px;
  }
  .month-tile .month-bottom {
    font-size: 80px;
    letter-spacing: 1px;
    margin-top: 6px;
  }

  /* ─── Title block ─── */
  .title {
    position: absolute;
    top: 90px;
    left: 360px;
    color: #ffffff;
    font-size: 132px;
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 0.95;
    z-index: 3;
  }

  /* ─── Italic tagline ─── */
  .tagline {
    position: absolute;
    top: 430px;
    left: 90px;
    width: 1280px;
    color: #ffffff;
    font-size: 56px;
    font-weight: 700;
    font-style: italic;
    line-height: 1.2;
    z-index: 3;
  }

  /* ─── Date pill ─── */
  .date-pill {
    position: absolute;
    top: 760px;
    left: 220px;
    height: 96px;
    padding: 0 56px;
    border: 4px solid #18DAE3;
    border-radius: 60px;
    background: transparent;
    color: #ffffff;
    font-size: 42px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }

  /* ─── Venue display name (below pill) ─── */
  .venue-name {
    position: absolute;
    top: 880px;
    left: 220px;
    width: 800px;
    text-align: center;
    color: #ffffff;
    font-size: 38px;
    font-weight: 600;
    z-index: 3;
  }

  /* ─── Venue logo (right of pill) ─── */
  .venue-logo-wrap {
    position: absolute;
    top: 750px;
    left: 1080px;
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }
  .venue-logo-wrap.circular {
    border-radius: 50%;
    overflow: hidden;
    background: #ffffff;
  }
  .venue-logo-wrap img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .venue-logo-wrap.circular img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ─── Malaga-AI vertical logo (bottom-left) ─── */
  .malaga-logo-vertical {
    position: absolute;
    bottom: 40px;
    left: 70px;
    width: 170px;
    height: auto;
    z-index: 3;
  }

  /* ─── Sponsor (bottom-centre) ─── */
  .sponsor {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
  }
  .sponsor img {
    height: 60px;
    width: auto;
    filter: invert(1);
    opacity: 0.7;
    display: block;
  }
</style>
</head>
<body>

  <img class="side-photo" src="{{SIDE_PHOTO}}" alt="" />

  <div class="month-tile">
    <span class="month-top">{{MONTH_TOP}}</span>
    <span class="month-bottom">{{MONTH_BOTTOM}}</span>
  </div>

  <h1 class="title">Malaga-AI<br/>Networking Night</h1>

  <p class="tagline">{{TAGLINE}}</p>

  <div class="date-pill">{{DATE}} | {{TIME}}</div>

  <div class="venue-name">{{VENUE_NAME}}</div>

  <div class="venue-logo-wrap {{VENUE_LOGO_CLASS}}">
    <img src="{{VENUE_LOGO}}" alt="" />
  </div>

  <img class="malaga-logo-vertical" src="{{MALAGA_LOGO_VERTICAL}}" alt="Malaga-AI" />

  <div class="sponsor">
    <img src="{{SPONSOR_LOGO}}" alt="Grupo Billingham" />
  </div>

</body>
</html>
